<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第五人格前三年地区数据看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f6f4ee;
  --panel:#fffdf8;
  --panel-2:#f0eee6;
  --ink:#202124;
  --muted:#696b70;
  --soft:#8b8d93;
  --line:#ddd8ca;
  --line-strong:#c9c0ac;
  --teal:#167d7f;
  --teal-soft:#e0f3f2;
  --coral:#c45a3f;
  --coral-soft:#f8e5de;
  --green:#4b7f38;
  --green-soft:#e8f2e2;
  --gold:#9a6a16;
  --gold-soft:#f5ead2;
  --shadow:0 18px 50px rgba(45,38,24,.08);
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --sans:"Inter","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
button,input,textarea{font:inherit}
.app{min-height:100vh}
.topbar{position:sticky;top:0;z-index:10;background:rgba(246,244,238,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar-inner{width:100%;max-width:1480px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700}
.brand h1{margin:0;font-size:18px;letter-spacing:0;font-weight:700;white-space:nowrap}
.brand span{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.page{width:100%;max-width:1480px;margin:0 auto;padding:22px 24px 34px}
.surface{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.intro{padding:22px 26px;display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:14px}
.intro-title{font-size:22px;font-weight:700;margin:0 0 6px}
.intro-copy{margin:0;color:var(--muted);max-width:800px}
.summary-panel{padding:16px 18px;margin:-4px 0 14px;display:grid;gap:13px}
.summary-top{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.summary-stat{border:1px solid var(--line);border-radius:8px;background:#fff;padding:12px}
.summary-stat small{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}
.summary-stat strong{font-family:var(--mono);font-size:20px}
.summary-copy{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.summary-copy p{margin:0;color:var(--muted)}
.summary-copy strong{color:var(--ink)}
.region-summary{display:flex;flex-wrap:wrap;gap:7px}
.region-chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 9px;color:var(--muted);font-size:12px}
.chips{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.chip{height:28px;display:inline-flex;align-items:center;gap:6px;padding:0 9px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:12px;font-weight:600}
.chip.teal{border-color:#b6dcda;background:var(--teal-soft);color:var(--teal)}
.chip.gold{border-color:#e2c98f;background:var(--gold-soft);color:var(--gold)}
.metric-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:14px}
.metric-panel{display:grid;grid-template-columns:1fr;gap:10px}
.metric{padding:15px 16px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.metric small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;font-weight:600;margin-bottom:8px}
.metric small svg{width:15px;height:15px}
.metric strong{font-family:var(--mono);font-size:25px;line-height:1.1}
.metric span{display:block;color:var(--soft);font-size:12px;margin-top:6px}
.main-grid{display:grid;grid-template-columns:1fr;gap:14px}
.main-grid>*{min-width:0}
.section-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.section-title{display:flex;align-items:center;gap:9px;font-weight:700}
.section-title svg{width:18px;height:18px;color:var(--teal)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel-2)}
.seg button{border:0;background:transparent;padding:7px 10px;cursor:pointer;color:var(--muted);font-weight:700;font-size:12px}
.seg button.active{background:var(--ink);color:#fff}
.table-wrap{overflow:auto;max-height:650px}
.estimate-wrap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.estimate-panel{min-width:0;border:1px solid var(--line);border-radius:8px;background:#fff;overflow:hidden}
.estimate-title{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.estimate-title strong{font-size:15px}
.estimate-title span{color:var(--muted);font-size:12px}
.estimate-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);background:#faf8f1}
.estimate-summary small{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}
.estimate-summary strong{font-family:var(--mono);font-size:15px}
.estimate-table-wrap{overflow:auto;max-height:520px}
.estimate-table{min-width:1180px}
.estimate-table th{position:sticky;top:0}
.estimate-table input{width:76px;border:1px solid var(--line);border-radius:6px;padding:5px 6px;background:#fff;font-family:var(--mono);font-size:12px;text-align:right}
.estimate-table .country-base{color:var(--muted);font-family:var(--mono)}
.estimate-table .output{font-family:var(--mono);font-weight:600}
.estimate-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.selection-summary{color:var(--muted);font-size:12px}
.selection-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.primary-btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:6px;padding:7px 10px;font-weight:700;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.primary-btn svg{width:15px;height:15px}
.primary-btn[disabled]{opacity:.45;cursor:not-allowed}
.ghost-btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:7px 10px;font-weight:700;font-size:12px;cursor:pointer}
.ghost-btn.active{border-color:#b6dcda;background:var(--teal-soft);color:var(--teal)}
table{width:100%;border-collapse:separate;border-spacing:0}
th,td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{position:sticky;top:0;background:#f3f0e7;color:var(--muted);font-size:12px;font-weight:700;z-index:1}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:inherit;z-index:2}
thead tr:first-child th{top:0}
thead tr:nth-child(2) th{top:39px}
thead th:first-child{z-index:3}
tbody tr{background:var(--panel)}
tbody tr:hover{background:#f9f6ed}
tbody tr.selected{background:#eaf5f4}
tbody tr.region{background:#fbfaf4}
tbody tr.dimmed{opacity:.58}
tbody tr.country td:first-child{color:var(--muted)}
td.num{font-family:var(--mono);font-weight:500}
td.rpd{color:var(--teal);font-family:var(--mono);font-weight:600}
.name-cell{display:flex;align-items:center;gap:8px;min-width:210px}
.name-cell.gap-sm{gap:6px}
.toggle{width:24px;height:24px;border:1px solid var(--line);border-radius:6px;background:#fff;display:inline-grid;place-items:center;cursor:pointer;flex:0 0 auto}
.toggle svg{width:14px;height:14px}
.toggle.empty{visibility:hidden}
.node-check{width:16px;height:16px;margin:0;accent-color:var(--teal);flex:0 0 auto}
.level-1{padding-left:18px}.level-2{padding-left:36px}
.region-pill{font-size:11px;border-radius:999px;padding:2px 7px;background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
.empty{color:#b5afa1}
.side{display:grid;grid-template-columns:1fr;gap:14px;align-content:start}
.chart-box{padding:14px 16px 18px}
.chart-wrap{height:260px}
.detail-list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}
.detail-item{border:1px solid var(--line);border-radius:8px;padding:11px;background:#fff}
.detail-item small{display:block;color:var(--muted);font-size:11px;margin-bottom:6px}
.detail-item strong{font-family:var(--mono);font-size:17px}
.region-map{padding:14px 16px;display:grid;gap:10px}
.map-row{display:grid;grid-template-columns:82px 1fr;gap:10px;align-items:start}
.map-name{font-weight:700}
.country-tags{display:flex;flex-wrap:wrap;gap:6px}
.country-tag{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 8px;color:var(--muted);font-size:12px}
.missing{padding:14px 16px;color:var(--muted);font-size:13px}
.missing-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.toast{position:fixed;right:22px;bottom:22px;background:var(--ink);color:#fff;padding:12px 14px;border-radius:8px;box-shadow:0 16px 38px rgba(0,0,0,.22);font-weight:600;font-size:13px;transform:translateY(18px);opacity:0;pointer-events:none;transition:.18s}
.toast.show{transform:translateY(0);opacity:1}
body .surface{box-shadow:0 10px 28px rgba(45,38,24,.06)}
body .metric{padding:13px 15px}
body .metric strong{font-size:24px}
body th,body td{padding-top:9px;padding-bottom:9px}
@media(max-width:900px){
  .toolbar,.main-grid{grid-template-columns:1fr}
  .metric-grid{grid-template-columns:1fr}
  .summary-top,.summary-copy{grid-template-columns:1fr}
  .estimate-wrap{grid-template-columns:1fr}
}
@media(max-width:720px){
  .topbar-inner,.intro{align-items:stretch;flex-direction:column}
  .metric-panel{grid-template-columns:1fr}
  .page{padding:14px}
  .detail-list{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark">V</div>
        <div>
          <h1>第五人格前三年地区数据看板</h1>
          <span>全球 - 地区 - 国家，折叠看汇总，展开看明细</span>
        </div>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="surface intro">
      <div>
        <p class="intro-title">第五人格前三年地区表现</p>
        <p class="intro-copy">全球、地区、国家三层聚合。各国家按首个有效月份起算前三年，下载和收入求和，RPD 按收入除以下载加权计算。</p>
      </div>
      <div class="chips">
        <span class="chip teal"><i data-lucide="layers"></i>三层结构</span>
        <span class="chip gold"><i data-lucide="sigma"></i>加权 RPD</span>
        <span class="chip"><i data-lucide="calendar-range"></i>前三年</span>
      </div>
    </section>

    <section class="surface summary-panel" id="marketSummary"></section>

    <section class="metric-grid" id="metricGrid"></section>

    <div class="main-grid">
      <section class="surface">
        <div class="section-head">
          <div class="section-title"><i data-lucide="network"></i>分地区数据树</div>
          <div class="seg" id="viewMode">
            <button type="button" data-mode="all" class="active">全部指标</button>
            <button type="button" data-mode="download">下载</button>
            <button type="button" data-mode="revenue">收入</button>
            <button type="button" data-mode="rpd">RPD</button>
          </div>
        </div>
        <div class="table-wrap">
          <table id="dataTable"></table>
        </div>
      </section>

      <section class="surface">
        <div class="section-head">
          <div class="section-title"><i data-lucide="calculator"></i>产品预估</div>
          <button class="primary-btn" type="button" id="saveEstimate"><i data-lucide="save"></i>保存预估</button>
        </div>
        <div class="chart-box">
          <div class="estimate-toolbar" id="selectionToolbar"></div>
          <div class="estimate-wrap" id="estimateWorkbench"></div>
        </div>
      </section>

      <aside class="side">
        <section class="surface">
          <div class="section-head">
            <div class="section-title"><i data-lucide="bar-chart-3"></i>前三年趋势</div>
          </div>
          <div class="chart-box">
            <div class="chart-wrap"><canvas id="trendChart"></canvas></div>
            <div class="detail-list" id="detailList"></div>
          </div>
        </section>

        <section class="surface">
          <div class="section-head">
            <div class="section-title"><i data-lucide="map"></i>区域结构</div>
          </div>
          <div class="region-map" id="regionMap"></div>
        </section>

        <section class="surface">
          <div class="section-head">
            <div class="section-title"><i data-lucide="circle-alert"></i>区域完整性</div>
          </div>
          <div class="missing" id="missingBox"></div>
        </section>
      </aside>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
const YEARS = [
  { key: "y1", label: "第 1 年" },
  { key: "y2", label: "第 2 年" },
  { key: "y3", label: "第 3 年" }
];

const REGIONS = [
  { id: "sea", label: "东南亚", countries: [
    ["ID", "印尼"], ["VN", "越南"], ["TH", "泰国"], ["MY", "马来西亚"], ["PH", "菲律宾"]
  ]},
  { id: "jktw", label: "日韩台", countries: [
    ["JP", "日本"], ["KR", "韩国"], ["TW", "台湾"]
  ]},
  { id: "west", label: "欧美", countries: [
    ["US", "美国"], ["GB", "英国"], ["DE", "德国"], ["IT", "意大利"], ["CA", "加拿大"], ["FR", "法国"], ["AU", "澳大利亚"], ["NZ", "新西兰"]
  ]},
  { id: "mena", label: "中东", countries: [
    ["IQ", "伊拉克"], ["SA", "沙特阿拉伯"], ["DZ", "阿尔及利亚"], ["EG", "埃及"], ["MA", "摩洛哥"]
  ]},
  { id: "latam", label: "拉美", countries: [
    ["BR", "巴西"], ["MX", "墨西哥"], ["PE", "秘鲁"], ["CO", "哥伦比亚"], ["CL", "智利"], ["AR", "阿根廷"]
  ]}
];

const PRODUCTS = {
  "/mobile-legends.html": {
    query: "Mobile Legends: Bang Bang",
    fallbackName: "Mobile Legends",
    title: "Mobile Legends 前三年地区数据看板",
    heading: "Mobile Legends 前三年地区表现",
    mark: "ML"
  },
  "/brawl-stars.html": {
    query: "Brawl Stars",
    fallbackName: "Brawl Stars",
    title: "Brawl Stars 前三年地区数据看板",
    heading: "Brawl Stars 前三年地区表现",
    mark: "BS"
  },
  default: {
    query: "Identity V",
    fallbackName: "第五人格",
    title: "第五人格前三年地区数据看板",
    heading: "第五人格前三年地区表现",
    mark: "V"
  }
};

const PRODUCT = PRODUCTS[location.pathname] || PRODUCTS.default;

const COUNTRY_ALIASES = (() => {
  const aliases = { UK: "GB", UAE: "AE" };
  for (const region of REGIONS) {
    for (const [code, label] of region.countries) {
      aliases[code] = code;
      aliases[label] = code;
    }
  }
  aliases["美国"] = "US";
  aliases["英国"] = "GB";
  aliases["韩国"] = "KR";
  aliases["日本"] = "JP";
  return aliases;
})();

const state = {
  source: "Sensor Tower",
  selected: "WW",
  mode: "all",
  open: { WW: true, sea: false, jktw: false, west: false, mena: false, latam: false },
  estimateOpen: Object.fromEntries(REGIONS.map(region => [region.id, true])),
  countryData: {},
  includedCountries: new Set(allCountryCodes()),
  showSelectedOnly: false,
  estimate: { conservative: {}, optimistic: {} },
  estimateReady: false,
  chart: null
};

function blankYear() {
  return { downloads: null, revenue: null, rpd: null, startDate: null, endDate: null };
}

function yearFromValues(downloads, revenue, rpd, meta = {}) {
  const d = finiteOrNull(downloads);
  const rev = finiteOrNull(revenue);
  let cellRpd = finiteOrNull(rpd);
  if (cellRpd == null && d && rev != null) cellRpd = rev / d;
  return { downloads: d, revenue: rev, rpd: cellRpd, startDate: meta.startDate || null, endDate: meta.endDate || null };
}

function finiteOrNull(value) {
  const n = Number(value);
  return Number.isFinite(n) ? n : null;
}

function resetData() {
  const next = {};
  for (const region of REGIONS) {
    for (const [code] of region.countries) next[code] = [blankYear(), blankYear(), blankYear()];
  }
  state.countryData = next;
}

function normalizeApiData(result) {
  resetData();
  const byCountry = result?.byCountry || {};
  for (const region of REGIONS) {
    for (const [code] of region.countries) {
      const rows = byCountry[code] || [];
      state.countryData[code] = YEARS.map((_, index) => {
        const row = rows[index] || {};
        return yearFromValues(row.downloads, row.revenue, row.rpd, row);
      });
    }
  }
  state.source = result?.name || "Sensor Tower";
  state.estimate = { conservative: {}, optimistic: {} };
  state.estimateReady = false;
}

function aggregate(codes) {
  const out = YEARS.map(() => ({ downloads: 0, revenue: 0, rpd: null, hasDownloads: false, hasRevenue: false }));
  for (const code of codes) {
    const rows = state.countryData[code] || [];
    rows.forEach((row, index) => {
      if (row.downloads != null) {
        out[index].downloads += row.downloads;
        out[index].hasDownloads = true;
      }
      if (row.revenue != null) {
        out[index].revenue += row.revenue;
        out[index].hasRevenue = true;
      }
    });
  }
  return out.map(row => {
    const downloads = row.hasDownloads ? row.downloads : null;
    const revenue = row.hasRevenue ? row.revenue : null;
    return yearFromValues(downloads, revenue, downloads && revenue != null ? revenue / downloads : null);
  });
}

function allCountryCodes() {
  return REGIONS.flatMap(region => region.countries.map(([code]) => code));
}

function emptyRows() {
  return [blankYear(), blankYear(), blankYear()];
}

function isRegionKey(key) {
  return REGIONS.some(region => region.id === key);
}

function selectedCountryCodes() {
  return allCountryCodes().filter(code => state.includedCountries.has(code));
}

function filteredCodesForKey(key) {
  return codesForKey(key).filter(code => state.includedCountries.has(code));
}

function selectionStateForKey(key) {
  const codes = codesForKey(key);
  const selected = codes.filter(code => state.includedCountries.has(code)).length;
  return {
    total: codes.length,
    selected,
    checked: selected > 0 && selected === codes.length,
    indeterminate: selected > 0 && selected < codes.length
  };
}

function syncSelectedNode() {
  if (state.selected === "WW") return;
  if (!filteredCodesForKey(state.selected).length) state.selected = "WW";
}

function applyNodeSelection(key, checked) {
  for (const code of codesForKey(key)) {
    if (checked) state.includedCountries.add(code);
    else state.includedCountries.delete(code);
  }
  syncSelectedNode();
  render();
}

function selectedRegionSummaries() {
  return REGIONS.map(region => {
    const selected = region.countries.filter(([code]) => state.includedCountries.has(code));
    return {
      id: region.id,
      label: region.label,
      selectedCount: selected.length,
      totalCount: region.countries.length,
      countries: selected
    };
  }).filter(region => region.selectedCount > 0);
}

function selectedScopeText() {
  const summaries = selectedRegionSummaries();
  if (!summaries.length) return "未选择国家";
  return summaries.map(region => `${region.label} ${region.selectedCount}/${region.totalCount}`).join("、");
}

function codesForKey(key) {
  if (key === "WW") return allCountryCodes();
  const region = REGIONS.find(item => item.id === key);
  if (region) return region.countries.map(([code]) => code);
  return [key];
}

function dataForKey(key) {
  if (key === "WW" || isRegionKey(key)) return aggregate(filteredCodesForKey(key));
  return state.includedCountries.has(key) ? (state.countryData[key] || emptyRows()) : emptyRows();
}

function labelForKey(key) {
  if (key === "WW") return "全球";
  for (const region of REGIONS) {
    if (region.id === key) return region.label;
    const country = region.countries.find(([code]) => code === key);
    if (country) return country[1];
  }
  return key;
}

function totals(rows) {
  let downloads = 0;
  let revenue = 0;
  let hasDownloads = false;
  let hasRevenue = false;
  for (const row of rows) {
    if (row.downloads != null) { downloads += row.downloads; hasDownloads = true; }
    if (row.revenue != null) { revenue += row.revenue; hasRevenue = true; }
  }
  const finalDownloads = hasDownloads ? downloads : null;
  const finalRevenue = hasRevenue ? revenue : null;
  return yearFromValues(finalDownloads, finalRevenue, finalDownloads && finalRevenue != null ? finalRevenue / finalDownloads : null);
}

function clamp(value, min, max) {
  return Math.min(max, Math.max(min, value));
}

function roundInput(value, digits = 2) {
  if (!Number.isFinite(value)) return 0;
  return Number(value.toFixed(digits));
}

function baselineForCountry(code) {
  const rows = state.countryData[code] || [];
  const y1 = rows[0] || blankYear();
  const y2 = rows[1] || blankYear();
  const y3 = rows[2] || blankYear();
  const y1Downloads = y1.downloads || 0;
  const y2Downloads = y2.downloads || 0;
  const totalRevenue = rows.reduce((sum, row) => sum + (row.revenue || 0), 0);
  return {
    y1Downloads,
    totalRevenue,
    y1Rpd: y1.rpd || 0,
    y2Decay: y1Downloads ? y2Downloads / y1Downloads : 0,
    y2Rpd: y2.rpd || 0,
    y3Decay: y2Downloads ? (y3.downloads || 0) / y2Downloads : 0,
    y3Rpd: y3.rpd || 0
  };
}

function percentileRank(values, value) {
  const clean = values.filter(item => Number.isFinite(item)).sort((a, b) => a - b);
  if (!clean.length) return .5;
  if (clean.length === 1) return .5;
  const index = clean.findIndex(item => item >= value);
  const position = index < 0 ? clean.length - 1 : index;
  return position / (clean.length - 1);
}

function countryPerformanceScore(code) {
  const baselines = allCountryCodes().map(country => baselineForCountry(country));
  const base = baselineForCountry(code);
  const downloadValues = baselines.map(item => Math.log1p(item.y1Downloads));
  const revenueValues = baselines.map(item => Math.log1p(item.totalRevenue));
  const downloadRank = percentileRank(downloadValues, Math.log1p(base.y1Downloads));
  const revenueRank = percentileRank(revenueValues, Math.log1p(base.totalRevenue));
  const strongestSignal = Math.max(downloadRank, revenueRank);
  const blendedSignal = downloadRank * .55 + revenueRank * .45;
  return strongestSignal * .65 + blendedSignal * .35;
}

function capDefaultRevenueMultiple(params, base, scenario) {
  const y1Downloads = base.y1Downloads * Number(params.y1Coef || 0);
  const y2Downloads = y1Downloads * Number(params.y2Decay || 0);
  const y3Downloads = y2Downloads * Number(params.y3Decay || 0);
  const y1Revenue = y1Downloads * Number(params.y1Rpd || 0);
  const laterRevenue = y2Downloads * Number(params.y2Rpd || 0) + y3Downloads * Number(params.y3Rpd || 0);
  const maxRatio = scenario === "conservative" ? 2.35 : 2.75;
  const maxLaterRevenue = y1Revenue * (maxRatio - 1);
  if (y1Revenue > 0 && laterRevenue > maxLaterRevenue && laterRevenue > 0) {
    const factor = maxLaterRevenue / laterRevenue;
    params.y2Rpd = roundInput(params.y2Rpd * factor);
    params.y3Rpd = roundInput(params.y3Rpd * factor);
  }
  return params;
}

function defaultEstimateParams(code, scenario) {
  const base = baselineForCountry(code);
  const conservative = scenario === "conservative";
  const performance = countryPerformanceScore(code);
  const downloadScale = conservative
    ? 0.78 + performance * 0.17
    : 0.98 + performance * 0.28;
  const rpdScale = conservative ? 0.8 : 1.15;
  const decayScale = conservative ? 0.85 : 1.1;
  const y1Rpd = base.y1Rpd * rpdScale;
  const y2RpdLift = conservative ? 1.25 : 1.4;
  const y3RpdLift = conservative ? 1.4 : 1.65;
  return capDefaultRevenueMultiple({
    y1Coef: roundInput(downloadScale),
    y1Rpd: roundInput(y1Rpd),
    y2Decay: roundInput(clamp(base.y2Decay * decayScale, 0, 3)),
    y2Rpd: roundInput(Math.min(base.y2Rpd * rpdScale, y1Rpd * y2RpdLift)),
    y3Decay: roundInput(clamp(base.y3Decay * decayScale, 0, 3)),
    y3Rpd: roundInput(Math.min(base.y3Rpd * rpdScale, y1Rpd * y3RpdLift))
  }, base, scenario);
}

function initEstimateState(force = false) {
  if (state.estimateReady && !force) return;
  for (const scenario of ["conservative", "optimistic"]) {
    for (const code of allCountryCodes()) {
      if (!state.estimate[scenario][code] || force) {
        state.estimate[scenario][code] = defaultEstimateParams(code, scenario);
      }
    }
  }
  state.estimateReady = true;
}

function estimateCountry(code, scenario) {
  const params = state.estimate[scenario]?.[code] || defaultEstimateParams(code, scenario);
  const base = baselineForCountry(code);
  const y1Downloads = base.y1Downloads * Number(params.y1Coef || 0);
  const y2Downloads = y1Downloads * Number(params.y2Decay || 0);
  const y3Downloads = y2Downloads * Number(params.y3Decay || 0);
  const y1Revenue = y1Downloads * Number(params.y1Rpd || 0);
  const y2Revenue = y2Downloads * Number(params.y2Rpd || 0);
  const y3Revenue = y3Downloads * Number(params.y3Rpd || 0);
  return {
    y1Downloads,
    y1Revenue,
    totalDownloads: y1Downloads + y2Downloads + y3Downloads,
    totalRevenue: y1Revenue + y2Revenue + y3Revenue
  };
}

function estimateTotals(scenario) {
  return selectedCountryCodes().reduce((sum, code) => {
    const row = estimateCountry(code, scenario);
    sum.y1Downloads += row.y1Downloads;
    sum.y1Revenue += row.y1Revenue;
    sum.totalDownloads += row.totalDownloads;
    sum.totalRevenue += row.totalRevenue;
    return sum;
  }, { y1Downloads: 0, y1Revenue: 0, totalDownloads: 0, totalRevenue: 0 });
}

function buildRows() {
  const rows = [{ key: "WW", label: "全球", level: 0, kind: "world", children: true }];
  if (!state.open.WW) return rows;
  for (const region of REGIONS) {
    rows.push({ key: region.id, label: region.label, level: 1, kind: "region", children: true });
    if (state.open[region.id]) {
      for (const [code, label] of region.countries) rows.push({ key: code, label, code, level: 2, kind: "country", children: false });
    }
  }
  return rows;
}

  return `<div class="estimate-panel">

    <div class="estimate-summary">
      <div><small>首年下载</small><strong>${metricText(total.y1Downloads, "compact")}</strong></div>
      <div><small>首年收入</small><strong>${metricText(total.y1Revenue, "money")}</strong></div>
      <div><small>前三年下载</small><strong>${metricText(total.totalDownloads, "compact")}</strong></div>
      <div><small>前三年收入</small><strong>${metricText(total.totalRevenue, "money")}</strong></div>
    </div>
    <div class="estimate-table-wrap">
      <table class="estimate-table">
        <thead>
          <tr>
            <th>国家</th><th>第五人格首年下载</th>
            <th>首年下载系数</th><th>首年 RPD</th>
            <th>次年下载衰减</th><th>次年 RPD</th>
            <th>第三年下载衰减</th><th>第三年 RPD</th>
            <th>首年下载</th><th>首年收入</th><th>前三年下载</th><th>前三年收入</th>

function metricCell(metric, row) {
  if (metric === "下载") return `<td class="num">${formatCount(row.downloads)}</td>`;
  if (metric === "收入") return `<td class="num">${formatMoney(row.revenue)}</td>`;
  return `<td class="rpd">${formatRpd(row.rpd)}</td>`;
}

function formatCount(value) {
  if (value == null) return `<span class="empty">-</span>`;
  if (Math.abs(value) >= 1000000) return `${(value / 1000000).toFixed(2)}M`;
  if (Math.abs(value) >= 1000) return `${(value / 1000).toFixed(1)}K`;
  return Math.round(value).toLocaleString("en-US");
}

function formatMoney(value) {
  if (value == null) return `<span class="empty">-</span>`;
  if (Math.abs(value) >= 1000000) return `$${(value / 1000000).toFixed(2)}M`;
  if (Math.abs(value) >= 1000) return `$${(value / 1000).toFixed(1)}K`;
  return `$${Math.round(value).toLocaleString("en-US")}`;
}

function formatRpd(value) {
  if (value == null || value === 0) return `<span class="empty">-</span>`;
  return `$${value.toFixed(1)}`;
}

function metricText(value, type) {
  if (type === "money") return value == null ? "-" : formatMoney(value).replace(/<[^>]+>/g, "");
  if (type === "rpd") return value == null ? "-" : `$${value.toFixed(1)}`;
  if (type === "compact") return formatCount(value).replace(/<[^>]+>/g, "");
  return value == null ? "-" : Math.round(value).toLocaleString("en-US");
}

        revenue: { display: false, position: "right", grid: { drawOnChartArea: false }, ticks: { callback: value => formatAxis(value) } },
        rpd: { position: "right", grid: { drawOnChartArea: false }, ticks: { callback: value => `$${Number(value).toFixed(1)}`, color: rpd } },
        x: { grid: { display: false }, ticks: { color: muted } }
      }
    }

}

function colorMix(hex, alpha) {
  const value = hex.replace("#", "").trim();
  if (value.length !== 6) return hex;
  const r = parseInt(value.slice(0, 2), 16);
  const g = parseInt(value.slice(2, 4), 16);
  const b = parseInt(value.slice(4, 6), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function formatAxis(value) {
  if (Math.abs(value) >= 1000000) return `${(value / 1000000).toFixed(1)}M`;
  if (Math.abs(value) >= 1000) return `${Math.round(value / 1000)}K`;
  return value;
}

function monthValue(value) {
  if (!value) return null;
  const [year, month] = String(value).split("-").map(Number);
  if (!year || !month) return null;
  return year * 12 + month;
}

function monthLabel(value) {
  if (!value) return "-";
  const [year, month] = String(value).split("-");
  return `${Number(year)}年${Number(month)}月`;
}

function launchRows() {
  return REGIONS.flatMap(region => region.countries.map(([code, label]) => {
    if (!state.includedCountries.has(code)) return null;
    const firstYear = state.countryData[code]?.[0] || {};
    return {
      code,
      label,
      region: region.label,
      regionId: region.id,
      startDate: firstYear.startDate,
      downloads: firstYear.downloads,
      revenue: firstYear.revenue
    };
  })).filter(item => item?.startDate);
}

function topBy(items, getter) {
  return items.reduce((best, item) => {
    const value = getter(item);
    if (value == null) return best;
    if (!best || value > getter(best)) return item;
    return best;
  }, null);
}

function renderSummary() {
  const el = document.getElementById("marketSummary");
  if (!selectedCountryCodes().length) {
    el.innerHTML = `<p class="intro-copy">Please select at least one country or region to refresh the summary.</p>`;
    return;
  }
  const launches = launchRows();
  const rows = dataForKey("WW");
  const total = totals(rows);
  const y1 = rows[0] || blankYear();

  if (!launches.length || total.downloads == null) {
    el.innerHTML = `<p class="intro-copy">正在等待 Sensor Tower 返回各国家首个有效月份和前三年表现。</p>`;
    return;
  }

  const earliestValue = Math.min(...launches.map(item => monthValue(item.startDate)).filter(Boolean));
  const latestValue = Math.max(...launches.map(item => monthValue(item.startDate)).filter(Boolean));
  const earliest = launches.find(item => monthValue(item.startDate) === earliestValue)?.startDate;
  const latest = launches.find(item => monthValue(item.startDate) === latestValue)?.startDate;
  const firstWave = launches
    .filter(item => item.startDate === earliest)
    .slice(0, 5)
    .map(item => `${item.label}${item.code}`)
    .join("、");
  const staggered = latestValue > earliestValue;

  const regionStats = REGIONS.map(region => {
    const regionRows = dataForKey(region.id);
    const regionTotal = totals(regionRows);
    const starts = region.countries
      .filter(([code]) => state.includedCountries.has(code))
      .map(([code]) => state.countryData[code]?.[0]?.startDate)
      .filter(Boolean)
      .sort();
    return {
      label: region.label,
      firstStart: starts[0],
      lastStart: starts[starts.length - 1],
      y1: regionRows[0] || blankYear(),
      total: regionTotal
    };
  }).filter(item => item.total.downloads != null);

  const topRevenue = topBy(regionStats, item => item.total.revenue || 0);
  const topDownloads = topBy(regionStats, item => item.total.downloads || 0);
  const topRpd = topBy(regionStats, item => item.total.rpd || 0);
  const y3 = rows[2] || blankYear();
  const revenueTrend = y3.revenue != null && y1.revenue
    ? (y3.revenue >= y1.revenue ? "收入在第三年仍高于首年" : "收入峰值更集中在前两年")
    : "收入趋势随有效国家数据更新";

  el.innerHTML = `
    <div class="summary-top">
      <div class="summary-stat"><small>海外最早有效发布</small><strong>${monthLabel(earliest)}</strong></div>
      <div class="summary-stat"><small>发布节奏</small><strong>${staggered ? "陆续发布" : "基本同步"}</strong></div>
      <div class="summary-stat"><small>前三年海外规模</small><strong>${metricText(total.downloads, "compact")} / ${metricText(total.revenue, "money")}</strong></div>
    </div>
    <div class="summary-copy">
      <p><strong>海外发布：</strong>样本国家最早在 ${monthLabel(earliest)} 出现有效下载或收入，首批包括 ${firstWave || "部分国家"}；最晚首个有效月为 ${monthLabel(latest)}，${staggered ? "可以看作其他地区随后陆续放量。" : "样本地区基本同月起量。"}</p>
      <p><strong>整体表现：</strong>首年下载 ${metricText(y1.downloads, "compact")}、收入 ${metricText(y1.revenue, "money")}、RPD ${metricText(y1.rpd, "rpd")}；前三年累计下载 ${metricText(total.downloads, "compact")}、收入 ${metricText(total.revenue, "money")}、平均 RPD ${metricText(total.rpd, "rpd")}，${revenueTrend}。</p>
      <p><strong>大区表现：</strong>${topRevenue?.label || "-"}贡献前三年收入最高，${topDownloads?.label || "-"}下载规模最大，${topRpd?.label || "-"}RPD最高；地区差异主要体现在付费强度而不只是下载量。</p>
      <p><strong>读数口径：</strong>每个国家先按自己的首个有效月份切首年、次年、第三年，再向大区和全球汇总。</p>
    </div>
    <div class="region-summary">
      ${regionStats.map(item => `<span class="region-chip">${item.label} ${monthLabel(item.firstStart)}起 · ${metricText(item.total.downloads, "compact")} · ${metricText(item.total.revenue, "money")} · RPD ${metricText(item.total.rpd, "rpd")}</span>`).join("")}
    </div>
  `;
}

function render() {
  renderProductChrome();
  renderSummary();
  renderMetrics();
  renderTable();
  renderEstimate();
  renderDetail();
  renderRegionMap();
  renderMissing();
  lucide.createIcons();
  syncCheckboxStates();
}

function renderProductChrome() {
  document.title = PRODUCT.title;
  document.querySelector(".brand-mark").textContent = PRODUCT.mark;
  document.querySelector(".brand h1").textContent = PRODUCT.title;
  document.querySelector(".intro-title").textContent = PRODUCT.heading;
}

function syncCheckboxStates() {
  document.querySelectorAll('input[data-indeterminate="true"]').forEach(input => {
    input.indeterminate = true;
  });
}

function toggleNode(key, event) {
  if (event) event.stopPropagation();
  state.open[key] = !state.open[key];
  render();
}

function toggleEstimateRegion(key) {
  state.estimateOpen[key] = !state.estimateOpen[key];
  renderEstimate();
  lucide.createIcons();
  syncCheckboxStates();
}

function selectNode(key) {
  state.selected = key;
  render();
}

function setStatus(type, message) {
  const dot = document.getElementById("statusDot");
  if (!dot) return;
  dot.className = `dot ${type}`;
  document.getElementById("statusText").textContent = message;
}

function toast(message) {
  const el = document.getElementById("toast");
  el.textContent = message;
  el.classList.add("show");
  window.clearTimeout(toast._timer);
  toast._timer = window.setTimeout(() => el.classList.remove("show"), 2600);
}

function estimateRowsForStatic(scenario) {
  return REGIONS.map(region => {
    const countryRows = region.countries.filter(([code]) => state.includedCountries.has(code)).map(([code, label]) => {
      const params = state.estimate[scenario][code] || defaultEstimateParams(code, scenario);
      const base = baselineForCountry(code);
      const out = estimateCountry(code, scenario);
      return `<tr>
        <td>${label} ${code}</td>
        <td>${metricText(base.y1Downloads, "compact")}</td>
        <td>${Number(params.y1Coef || 0).toFixed(2)}</td>
        <td>${metricText(Number(params.y1Rpd || 0), "rpd")}</td>
        <td>${Number(params.y2Decay || 0).toFixed(2)}</td>
        <td>${metricText(Number(params.y2Rpd || 0), "rpd")}</td>
        <td>${Number(params.y3Decay || 0).toFixed(2)}</td>
        <td>${metricText(Number(params.y3Rpd || 0), "rpd")}</td>
        <td>${metricText(out.y1Downloads, "compact")}</td>
        <td>${metricText(out.y1Revenue, "money")}</td>
        <td>${metricText(out.totalDownloads, "compact")}</td>
        <td>${metricText(out.totalRevenue, "money")}</td>
      </tr>`;
    }).join("");
    return countryRows ? `<tr class="region"><td colspan="12">${region.label}</td></tr>${countryRows}` : "";
  }).join("");
}

function buildCurrentPageHtml() {
  const clone = document.documentElement.cloneNode(true);
  const sourceInputs = [...document.querySelectorAll("input")];
  clone.querySelectorAll("input").forEach((input, index) => {
    const source = sourceInputs[index];
    if (!source) return;
    input.setAttribute("value", source.value);
  });

  const sourceCanvases = [...document.querySelectorAll("canvas")];
  clone.querySelectorAll("canvas").forEach((canvas, index) => {
    const source = sourceCanvases[index];
    if (!source) return;
    const image = document.createElement("img");
    image.src = source.toDataURL("image/png");
    image.alt = "前三年趋势图";
    image.style.maxWidth = "100%";
    image.style.height = "100%";
    image.style.objectFit = "contain";
    canvas.replaceWith(image);
  });

  clone.querySelectorAll("script").forEach(script => script.remove());
  const toastNode = clone.querySelector("#toast");
  if (toastNode) {
    toastNode.classList.remove("show");
    toastNode.textContent = "";
  }
  return `<!DOCTYPE html>\n${clone.outerHTML}`;
}

function downloadHtml(filename, html) {
  const blob = new Blob([html], { type: "text/html;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = filename;
  link.style.display = "none";
  document.body.appendChild(link);
  link.click();
  link.remove();
  window.setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function saveEstimate() {
  try {
    const stamp = new Date().toISOString().slice(0, 19).replace(/[-:T]/g, "");
    const filename = `${PRODUCT.query.toLowerCase().replace(/[^a-z0-9]+/g, "-")}-estimate-selected-${selectedCountryCodes().length}c-${stamp}.html`;
    downloadHtml(filename, buildStaticEstimateHtml());
    toast(`已下载 ${filename}`);
  } catch (error) {
    toast(error.message);
  }
}

async function fetchProduct() {
  const name = PRODUCT.query;
  setStatus("warn", "正在拉取 Sensor Tower 数据...");
  try {
    const response = await fetch("/api/fetch-comp", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name })
    });
    const payload = await response.json();
    if (!response.ok || !payload.ok) throw new Error(payload.error || "请求失败");
    if (!payload.result?.found) throw new Error(payload.result?.error || "没有找到产品");
    normalizeApiData(payload.result);
    setStatus("ok", `已拉取 ${payload.result.name}，按指定地区聚合`);
    toast("数据已更新");
    render();
  } catch (error) {
    setStatus("err", error.message);
    toast("拉取失败，仍保留当前数据");
  }
}

function parseNumber(value) {
  if (value == null) return null;
  const cleaned = String(value).replace(/[$,%\s"]/g, "").replace(/,/g, "");
  if (!cleaned || cleaned === "-") return null;
  const n = Number(cleaned);
  return Number.isFinite(n) ? n : null;
}

function normalizeCountryCode(value) {
  const raw = String(value || "").trim();
  if (!raw) return "";
  return COUNTRY_ALIASES[raw] || COUNTRY_ALIASES[raw.toUpperCase()] || raw.toUpperCase();
}

function normalizeHeader(header) {
  return String(header || "").toLowerCase().replace(/\s+/g, " ").trim();
}

function applyPaste() {
  const raw = document.getElementById("pasteBox").value.trim();
  if (!raw) return;
  const lines = raw.split(/\r?\n/).filter(Boolean);
  const separator = raw.includes("\t") ? "\t" : ",";
  const header = lines.shift().split(separator).map(normalizeHeader);
  const codeIndex = header.findIndex(item => ["region", "country", "code", "地区", "国家"].includes(item));
  if (codeIndex < 0) {
    toast("没有找到 Region/Country 列");
    return;
  }
  const findIndex = patterns => header.findIndex(item => patterns.some(pattern => item.includes(pattern)));
  const indices = [
    {
      download: findIndex(["1st year download", "year 1 download", "第 1 年下载", "首年下载"]),
      revenue: findIndex(["1st year revenue", "year 1 revenue", "第 1 年收入", "首年收入"]),
      rpd: findIndex(["1st year rpd", "year 1 rpd", "第 1 年rpd", "首年rpd"])
    },
    {
      download: findIndex(["2nd year download", "year 2 download", "第 2 年下载"]),
      revenue: findIndex(["2nd year revenue", "year 2 revenue", "第 2 年收入"]),
      rpd: findIndex(["2nd year rpd", "year 2 rpd", "第 2 年rpd"])
    },
    {
      download: findIndex(["3rd year download", "year 3 download", "第 3 年下载"]),
      revenue: findIndex(["3rd year revenue", "year 3 revenue", "第 3 年收入"]),
      rpd: findIndex(["3rd year rpd", "year 3 rpd", "第 3 年rpd"])
    }
  ];
  resetData();
  let imported = 0;
  for (const line of lines) {
    const cells = line.split(separator);
    const code = normalizeCountryCode(cells[codeIndex]);
    if (!state.countryData[code]) continue;
    state.countryData[code] = indices.map(item => yearFromValues(
      item.download >= 0 ? parseNumber(cells[item.download]) : null,
      item.revenue >= 0 ? parseNumber(cells[item.revenue]) : null,
      item.rpd >= 0 ? parseNumber(cells[item.rpd]) : null
    ));
    imported += 1;
  }
  state.source = "手动导入";
  state.estimate = { conservative: {}, optimistic: {} };
  state.estimateReady = false;
  setStatus("ok", `已导入 ${imported} 个国家`);
  render();
  toast("导入完成");
}

document.getElementById("viewMode").addEventListener("click", event => {
  const button = event.target.closest("button[data-mode]");
  if (!button) return;
  state.mode = button.dataset.mode;
  for (const item of document.querySelectorAll("#viewMode button")) item.classList.toggle("active", item === button);
  render();
});

document.getElementById("dataTable").addEventListener("click", event => {
  const toggle = event.target.closest("button[data-toggle-key]");
  if (toggle) {
    toggleNode(toggle.dataset.toggleKey, event);
    return;
  }
  const row = event.target.closest("tr[data-node-key]");
  if (!row || event.target.closest("input,button")) return;
  selectNode(row.dataset.nodeKey);
});

document.getElementById("dataTable").addEventListener("change", event => {
  const checkbox = event.target.closest("input[data-select-key]");
  if (!checkbox) return;
  applyNodeSelection(checkbox.dataset.selectKey, checkbox.checked);
});

document.getElementById("selectionToolbar").addEventListener("click", event => {
  const button = event.target.closest("button[data-select-action]");
  if (!button) return;
  if (button.dataset.selectAction === "all") {
    state.includedCountries = new Set(allCountryCodes());
  } else if (button.dataset.selectAction === "clear") {
    state.includedCountries = new Set();
  } else if (button.dataset.selectAction === "toggle-visible") {
    state.showSelectedOnly = !state.showSelectedOnly;
  }
  syncSelectedNode();
  render();
});

document.getElementById("estimateWorkbench").addEventListener("click", event => {
  const toggle = event.target.closest("button[data-estimate-toggle]");
  if (!toggle) return;
  toggleEstimateRegion(toggle.dataset.estimateToggle);
});

document.getElementById("estimateWorkbench").addEventListener("change", event => {
  const checkbox = event.target.closest("input[data-select-key]");
  if (checkbox) {
    applyNodeSelection(checkbox.dataset.selectKey, checkbox.checked);
    return;
  }
  const input = event.target.closest("input[data-scenario][data-code][data-field]");
  if (!input) return;
  const { scenario, code, field } = input.dataset;
  if (!state.estimate[scenario]) state.estimate[scenario] = {};
  if (!state.estimate[scenario][code]) state.estimate[scenario][code] = defaultEstimateParams(code, scenario);
  state.estimate[scenario][code][field] = Math.max(0, Number(input.value) || 0);
  renderEstimate();
  lucide.createIcons();
});

document.getElementById("saveEstimate").addEventListener("click", saveEstimate);

resetData();
render();
fetchProduct();
</script>
